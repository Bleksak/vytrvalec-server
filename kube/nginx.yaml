apiVersion: apps/v1
kind: Deployment
metadata:
  name: vytrvalec-nginx
spec:
  selector:
    matchLabels:
      app: vytrvalec-nginx
  template:
    metadata:
      labels:
        app: vytrvalec-nginx
    spec:
      volumes:
        - name: shared-files
          emptyDir: {}

        - name: nginx-config-volume
          configMap:
            name: nginx-config

      containers:
      - name: vytrvalec-nginx
        image: nginx:1.25.4-alpine
        ports:
          - containerPort: 80

        volumeMounts:
          - name: shared-files
            mountPath: /var/www/vytrvalec

          - name: nginx-config-volume
            mountPath: /etc/nginx/conf.d/default.conf
            subPath: default.conf

      - name: vytrvalec-web
        # TODO: tady zmenit image na url
        imagePullPolicy: IfNotPresent
        image: web
        volumeMounts:
          - name: shared-files
            mountPath: /var/www/vytrvalec
        lifecycle:
          postStart:
            exec:
              command: ["/bin/sh", "-c", "cp -r /app/. /var/www/vytrvalec && chown -R www-data:www-data /var/www/vytrvalec"]
---
apiVersion: v1
kind: Service
metadata:
  name: vytrvalec-nginx
spec:
  selector:
    app: vytrvalec-nginx
  type: ClusterIP
  ports:
    - port: 80
      protocol: TCP
      targetPort: 80
      name: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  default.conf: |
    server {
        root /var/www/vytrvalec/public;

        location / {
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-NginX-Proxy true;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass http://client:3000;
            proxy_redirect off;

            error_page 502 = @static;
        }

        location /api/ {
            try_files $uri /index.php$is_args$args;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;

            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;

            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            internal;
        }

        location ~ \.php$ {
            return 404;
        }

        error_log /var/log/nginx/project_error.log;
        access_log /var/log/nginx/project_access.log;
    }
