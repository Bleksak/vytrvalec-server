apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vytrvalec-nginx-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - vytrvalec.kts.zcu.cz
      secretName: vytrvalec-kts-tls
  defaultBackend:
    service:
      name: vytrvalec-nginx
      port:
        number: 80
  rules:
    - host: vytrvalec.kts.zcu.cz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vytrvalec-nginx
                port:
                  number: 80
