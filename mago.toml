# Mago configuration file
# For more information, see https://mago.carthage.software/#/getting-started/configuration
php_version = "8.4.0"

[source]
paths = ["src"]
includes = ["vendor"]
excludes = []

[format]
print_width = 120
tab_width = 4
use_tabs = false

[linter]
default_plugins = true
plugins = ["symfony", "analysis", "best-practices", "comment", "consistency", "deprecation", "naming", "redundancy", "safety", "strictness"]

[[linter.rules]]
name = "maintainability/excessive-parameter-list"
level = "off"

[[linter.rules]]
name = "maintainability/too-many-properties"
level = "off"

[[linter.rules]]
name = "best-practices/no-boolean-flag-parameter"
level = "off"

[[linter.rules]]
name = "maintainability/too-many-methods"
level = "off"

[[linter.rules]]
name = "best-practices/no-else-clause"
level = "off"

[[linter.rules]]
name = "maintainability/cyclomatic-complexity"
level = "off"