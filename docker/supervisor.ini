[program:php-fpm]
command=docker-php-entrypoint php-fpm
autostart=true
autorestart=true
startretries=10
stderr_logfile=/var/log/php-fpm.err.log
stdout_logfile=/var/log/php-fpm.out.log
priority=10

[program:queue]
command=php bin/console messenger:consume --all --time-limit=3600
autostart=true
autorestart=true
startretries=10
stderr_logfile=/var/log/queue.err.log
stdout_logfile=/var/log/queue.out.log
priority=20
