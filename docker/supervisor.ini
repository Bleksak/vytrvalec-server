[program:queue]
command=php bin/console messenger:consume --all --time-limit=3600
autostart=true
autorestart=true
startretries=10
stderr_logfile=/var/log/queue.err.log
stdout_logfile=/var/log/queue.out.log
priority=20

[program:ws]
command=php bin/console mv:ws-submission-producer
autostart=true
autorestart=true
startretries=10
stderr_logfile=/var/log/ws.err.log
stdout_logfile=/var/log/ws.out.log
priority=10
