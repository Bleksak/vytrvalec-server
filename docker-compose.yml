version: "3"

services:
  ###> doctrine/doctrine-bundle ###
  database:
    image: mysql:${MYSQL_VERSION:-9.6.0}
    environment:
      MYSQL_ROOT_PASSWORD: vytrvalec
      MYSQL_DATABASE: vytrvalec
      MYSQL_USER: vytrvalec
      MYSQL_PASSWORD: vytrvalec
    volumes:
      - database_data:/var/lib/mysql:rw
    networks:
      - app-network
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/postgresql/data:rw
  ###< doctrine/doctrine-bundle ###
  php:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "1337:1337"
    expose:
      - 9000
    volumes:
      - .:/app
    networks:
      - app-network
    depends_on:
      - database

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/app
    depends_on:
      - php
    networks:
      - app-network

volumes:
  ###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###

networks:
  app-network:
    driver: bridge
