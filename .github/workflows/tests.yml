name: Tests

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libmagickwand-dev imagemagick libsqlite3-dev

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          extensions: imagick
          tools: composer
        env:
          COMPOSER_ALLOW_SUPERUSER: 1

      - name: Setup just
        uses: extractions/setup-just@v3

      - name: Setup project
        run: |
          just pre-init
          just init

      - name: Run Behat tests
        run: just test
